<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Bus Fever Party – Xe buýt tới rồi!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaeff6;--surface:#fff;--line:#c9d3e3;--ink:#1d2736;--muted:#56657c;--blue:#2f6fed;--green:#2e9f4d;--gold:#f2b01e;--goldInk:#3d2a00;--grey:#6a7890;--dark:#33445e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:"Inter","SF Pro Display","Segoe UI",system-ui,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:5;background:rgba(20,34,56,.58);padding:16px;padding-top:56px;overflow:auto}
#ov.show{display:flex}
#ov.menu{background:transparent;padding-top:16px}
.card{position:relative;background:#fff;border:3px solid var(--ink);border-radius:28px;box-shadow:0 8px 0 rgba(29,39,54,.28),0 28px 50px rgba(20,34,56,.25);padding:56px 28px 26px;max-width:520px;width:100%;text-align:center;margin:auto;animation:pop .32s cubic-bezier(.2,1.4,.4,1) both}
.card:before{content:"";position:absolute;left:0;right:0;top:0;height:52px;border-radius:24px 24px 0 0;background:var(--tone,var(--blue));opacity:.14}
.card.menu{background:transparent;border:0;box-shadow:none;max-width:660px;padding:0;animation:none}
.card.menu:before{display:none}
.badge{position:absolute;left:50%;top:-44px;transform:translateX(-50%);width:88px;height:88px;border-radius:50%;background:var(--tone,var(--blue));border:3px solid var(--ink);box-shadow:0 5px 0 rgba(29,39,54,.3);display:grid;place-items:center;color:#fff}
.badge svg{width:46px;height:46px}
.mascot{width:min(250px,56vw);height:auto;display:block;margin:0 auto -6px;filter:drop-shadow(0 7px 0 rgba(29,39,54,.2));animation:bob 2.4s ease-in-out infinite}
.logo{font-weight:800;font-size:clamp(46px,11vw,98px);line-height:.92;letter-spacing:-1px;margin:0 0 6px;display:flex;flex-direction:column;align-items:center}
.logo .w{display:flex;justify-content:center}
.logo .w+.w{font-size:.62em;margin-top:.02em}
.logo b{font-weight:800;display:inline-block;color:var(--lc);-webkit-text-stroke:.13em var(--ink);paint-order:stroke fill;text-shadow:0 .07em 0 var(--ink);transform:rotate(var(--r,0deg));animation:hop 2.8s ease-in-out infinite;animation-delay:var(--dl,0s)}
.logo .sp{width:.3em}
.ribbon{display:inline-block;margin:8px 0 4px;padding:5px 22px 3px;border-radius:999px;background:var(--gold);color:var(--goldInk);border:3px solid var(--ink);font-weight:800;font-size:clamp(16px,2.6vw,21px);box-shadow:0 4px 0 rgba(29,39,54,.3)}
h2{margin:0 0 6px;font-size:clamp(28px,5vw,38px);font-weight:800;color:var(--ink);line-height:1.05}
p{margin:6px 0 16px;font-size:18px;font-weight:500;line-height:1.4;color:#33415a}
.lead{display:inline-block;background:rgba(255,255,255,.92);border:2px solid var(--ink);border-radius:14px;padding:8px 16px;color:var(--ink);font-size:clamp(15px,2.2vw,19px);font-weight:700;margin:8px 0 18px;box-shadow:0 3px 0 rgba(29,39,54,.2)}
.btn{--b:var(--blue);--lip:#1c46a8;font:800 21px/1 "Inter","SF Pro Display",sans-serif;color:#fff;background:var(--b);border:0;border-radius:16px;padding:15px 26px 14px;cursor:pointer;box-shadow:0 5px 0 var(--lip),0 10px 16px rgba(20,34,56,.2);letter-spacing:.2px;transition:transform .08s,box-shadow .08s,filter .15s;margin:6px 5px 9px;display:inline-flex;align-items:center;justify-content:center;gap:10px;position:relative}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--lip),0 3px 6px rgba(20,34,56,.2)}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.btn svg{width:1.15em;height:1.15em;flex:none}
.btn.big{font-size:25px;padding:17px 34px 16px}
.btn.green{--b:#22a24a;--lip:#157334}
.btn.dark{--b:#33445e;--lip:#1d2736}
.btn.gold{--b:var(--gold);--lip:#b27b05;color:var(--goldInk)}
.btn.grey{--b:#7a879d;--lip:#546178}
.btn.red{--b:#e5484d;--lip:#a8272c}
.btn.round{width:54px;height:54px;padding:0;border-radius:50%;margin:4px 6px 8px}.btn.round svg{width:26px;height:26px}
.btn.wide{min-width:min(300px,78vw)}
.row{display:flex;flex-wrap:wrap;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:8px;margin-top:8px;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:4px 16px 3px;font-weight:800;font-size:20px;color:var(--ink);box-shadow:0 3px 0 rgba(29,39,54,.25)}
.coin{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a0,#f2b01e 60%,#c98a0b);border:2px solid var(--ink);display:inline-block;margin-top:-2px}
ol{text-align:left;margin:8px 0 18px;padding:0;list-style:none;counter-reset:h;font-size:16.5px;line-height:1.4}
ol li{margin-bottom:9px;padding-left:40px;position:relative;counter-increment:h}
ol li:before{content:counter(h);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:var(--tone,var(--blue));color:#fff;font-weight:800;font-size:15px;display:grid;place-items:center;border:2px solid var(--ink)}
.card.help{max-width:560px}
.stars{display:flex;justify-content:center;gap:6px;margin:4px 0 8px}
.stars svg{width:64px;height:64px;filter:drop-shadow(0 4px 0 rgba(29,39,54,.2))}
.stars svg:nth-child(2){transform:translateY(-8px)}
.earn{font-size:22px;font-weight:800;color:var(--ink);margin:2px 0 14px;display:flex;align-items:center;justify-content:center;gap:8px}
.nmrow{display:flex;justify-content:center;margin:2px 0 10px}
.nm{width:min(340px,82vw);font:800 20px/1 "Inter",sans-serif;color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:14px;padding:13px 16px 12px;text-align:center;box-shadow:0 4px 0 rgba(29,39,54,.25);outline:none}
.nm:focus{border-color:var(--blue);box-shadow:0 4px 0 rgba(47,111,237,.45)}
.nm.bad{border-color:var(--red,#e5484d);animation:shk .3s}
@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.board{list-style:none;margin:6px 0 14px;padding:0;text-align:left;counter-reset:none}
.board li{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;font-weight:700;font-size:17px;margin:0 0 6px;background:#f3f6fb;border:2px solid transparent;padding-left:12px}
.board li:before{display:none}
.board li.me{background:#fff7dc;border-color:var(--gold)}
.board .rk{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#dbe3f0;font-size:15px;font-weight:800;flex:none}
.board li:nth-child(1) .rk{background:#f2b01e}.board li:nth-child(2) .rk{background:#c3ccd9}.board li:nth-child(3) .rk{background:#e0a070}
.board .nn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board small{color:var(--muted);font-weight:600;font-size:13px;margin-right:4px}
.board b{font-weight:800}
@keyframes pop{from{transform:scale(.85) translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes hop{0%,70%,100%{transform:rotate(var(--r,0deg))}80%{transform:translateY(-.1em) rotate(var(--r,0deg))}}
@media (max-height:780px){.mascot{width:150px;margin-bottom:-2px}.btn.big{padding:13px 30px 12px;font-size:23px}.logo{font-size:clamp(40px,9vw,80px)}.lead{margin:4px 0 8px}.btn{margin:4px 5px 7px}}
@media (max-width:440px){.btn.big{font-size:20px;padding:15px 18px 14px;white-space:nowrap}.btn.wide{min-width:0;width:100%}.card{padding:56px 20px 22px}}
@media (prefers-reduced-motion:reduce){.btn{transition:none}.card,.mascot,.logo b{animation:none}}
</style>
</head>
<body>
<canvas id="c" aria-label="Bus Fever Party"></canvas>
<div id="ov"></div>
<script>
(()=>{
'use strict';
/* ====================== tiện ích ====================== */
const cv=document.getElementById('c'),ov=document.getElementById('ov');
const rnd=n=>Math.floor(Math.random()*n);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2;
const DX=[0,1,0,-1],DY=[-1,0,1,0];            // 0 lên, 1 phải, 2 xuống, 3 trái
const ANG=[-Math.PI/2,0,Math.PI/2,Math.PI];
const FONT='"Inter","SF Pro Display","Segoe UI",sans-serif';
const store={get(k,d){try{const v=localStorage.getItem('bfp_'+k);return v===null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem('bfp_'+k,JSON.stringify(v));}catch(e){}}};
let clearArm=false;
let RUN={pts:0,lv:0};
const S={name:store.get('name',''),level:1,tlevel:1,coins:0,sound:store.get('sound',true)};
let players=store.get('players',{});if(!players||typeof players!=='object')players={};
function loadProfile(n){S.name=n;const p=players[n]||{};S.coins=p.score|0;S.level=p.level||1;S.tlevel=p.tlevel||1;store.set('name',n);}
function saveProfile(){if(!S.name)return;players[S.name]={score:S.coins,level:S.level,tlevel:S.tlevel,t:Date.now()};store.set('players',players);}
if(S.name)loadProfile(S.name);
let draft=null;
function applyName(){
  const el=document.getElementById('nm');const v=((el?el.value:draft!==null?draft:S.name)||'').trim().replace(/\s+/g,' ').slice(0,20);
  if(!v){if(el){el.focus();el.classList.add('bad');}SFX.deny();return false;}
  if(v!==S.name||!players[v]){loadProfile(v);saveProfile();}
  draft=null;return true;
}
const PAL=[
 {c:'#ef4444',d:'#b91c1c',l:'#fca5a5'},{c:'#06b6d4',d:'#0e7490',l:'#a5f3fc'},
 {c:'#a3d52c',d:'#5f8a0d',l:'#d9f99d'},{c:'#fbbf24',d:'#b7791f',l:'#fde68a'},
 {c:'#f97316',d:'#c2410c',l:'#fdba74'},{c:'#22c55e',d:'#15803d',l:'#86efac'},
 {c:'#3b82f6',d:'#1d4ed8',l:'#93c5fd'},{c:'#8b5cf6',d:'#5b21b6',l:'#c4b5fd'},
 {c:'#ec4899',d:'#a3195b',l:'#f9a8d4'}
];
const IC='#1d2736',C_BLUE='#2f6fed',C_INK='#1d2736',C_MUTED='#56657c',C_GOLD='#f2b01e',C_GREEN='#2e9f4d',C_RED='#e5484d',C_LINE='#c9d3e3';

/* ====================== âm thanh (WebAudio) ====================== */
let AC=null,master=null;
function ac(){
  if(!S.sound)return null;
  if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.7;master.connect(AC.destination);}catch(e){return null;}}
  if(AC.state==='suspended')AC.resume();
  return AC;
}
function tone(f,d,type='sine',v=.15,slide=0,delay=0){
  const a=ac();if(!a)return;const t=a.currentTime+delay;
  const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.03);
}
function noise(d,v=.1,f0=1200,f1=300,delay=0){
  const a=ac();if(!a)return;const t=a.currentTime+delay,n=Math.floor(a.sampleRate*d);
  const buf=a.createBuffer(1,n,a.sampleRate),dat=buf.getChannelData(0);for(let i=0;i<n;i++)dat[i]=Math.random()*2-1;
  const s=a.createBufferSource();s.buffer=buf;const fl=a.createBiquadFilter();fl.type='bandpass';
  fl.frequency.setValueAtTime(f0,t);fl.frequency.exponentialRampToValueAtTime(f1,t+d);
  const g=a.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(fl);fl.connect(g);g.connect(master);s.start(t);
}
const SFX={
  click(){tone(520,.09,'triangle',.15,260)},
  bump(){tone(170,.16,'square',.08,-90);noise(.08,.05,400,200)},
  go(){tone(110,.38,'sawtooth',.06,160);noise(.32,.05,500,1600);tone(660,.09,'triangle',.09,300)},
  park(){tone(430,.14,'sine',.14,-170);tone(215,.1,'triangle',.08,0,.06)},
  board(n){tone(520+Math.min(n,18)*40,.07,'triangle',.07)},
  full(){[784,988,1175,1568].forEach((f,i)=>tone(f,.18,'triangle',.11,0,i*.06))},
  reveal(){tone(880,.08,'sine',.09,300)},
  shuffle(){noise(.5,.12,300,3000);[300,380,460,560].forEach((f,i)=>tone(f,.1,'sine',.06,0,i*.07))},
  sort(){[500,620,740,880].forEach((f,i)=>tone(f,.09,'triangle',.09,0,i*.05))},
  coin(){tone(988,.08,'square',.05);tone(1319,.18,'square',.05,0,.08)},
  win(){[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,.22,'triangle',.13,0,i*.11))},
  lose(){[392,349,311,262].forEach((f,i)=>tone(f,.28,'sawtooth',.07,-20,i*.16))},
  deny(){tone(200,.12,'square',.06,-60)},
  tick(){tone(1100,.05,'square',.05)}
};

/* ====================== vẽ cơ bản ====================== */
function rr(x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function txt(s,x,y,size,fill,stroke,align='center'){
  ctx.font='700 '+size+'px '+FONT;ctx.textAlign=align;ctx.textBaseline='middle';
  if(stroke){ctx.lineWidth=size*.22;ctx.strokeStyle=stroke;ctx.lineJoin='round';ctx.strokeText(s,x,y);}
  ctx.fillStyle=fill;ctx.fillText(s,x,y);
}
function btnFlat(x,y,w,h,col,r){ctx.fillStyle='rgba(24,36,64,.10)';rr(x-1,y+2,w+2,h+3,r+1);ctx.fill();ctx.fillStyle='rgba(24,36,64,.12)';rr(x,y+3,w,h,r);ctx.fill();ctx.fillStyle=col;rr(x,y,w,h,r);ctx.fill();}
const SKIN=['#f3d2b3','#e8b98f','#cf9468','#a8704a','#74482c'];
const HAIR=['#231815','#3e2a1e','#6a4426','#a8783a','#151515','#9a9a9a'];
function drawPax(x,y,r,col,flash,sd){
  const C=PAL[col],h=(((sd==null?col*13+5:sd)+1)*2654435761)>>>0,sk=SKIN[h%5],hr=HAIR[(h>>>5)%6],st=(h>>>9)%3;
  r*=.9;
  ctx.fillStyle='rgba(20,30,50,.16)';ctx.beginPath();ctx.ellipse(x,y+r*.95,r*.72,r*.2,0,0,TAU);ctx.fill();
  ctx.fillStyle='#2e3a52';rr(x-r*.4,y+r*.46,r*.34,r*.5,r*.12);ctx.fill();rr(x+r*.06,y+r*.46,r*.34,r*.5,r*.12);ctx.fill();   // chân
  ctx.fillStyle=C.d;rr(x-r*.8,y-r*.3,r*.27,r*.78,r*.13);ctx.fill();rr(x+r*.53,y-r*.3,r*.27,r*.78,r*.13);ctx.fill();          // tay áo
  ctx.fillStyle=sk;ctx.beginPath();ctx.arc(x-r*.665,y+r*.52,r*.14,0,TAU);ctx.arc(x+r*.665,y+r*.52,r*.14,0,TAU);ctx.fill();   // bàn tay
  ctx.fillStyle=C.c;rr(x-r*.58,y-r*.38,r*1.16,r*1.0,r*.3);ctx.fill();                                                        // thân áo
  ctx.fillStyle=sk;rr(x-r*.14,y-r*.56,r*.28,r*.28,r*.06);ctx.fill();                                                          // cổ
  if(st===0){ctx.fillStyle=hr;rr(x-r*.5,y-r*1.14,r*1.0,r*1.0,r*.4);ctx.fill();}                                              // tóc dài phía sau
  ctx.fillStyle=sk;ctx.beginPath();ctx.ellipse(x,y-r*.84,r*.4,r*.46,0,0,TAU);ctx.fill();                                      // mặt
  ctx.fillStyle=hr;ctx.beginPath();ctx.ellipse(x,y-r*1.0,r*.44,r*.3,0,Math.PI,TAU);ctx.fill();                                // tóc trên
  if(st===1){rr(x-r*.44,y-r*1.0,r*.12,r*.3,r*.05);ctx.fill();rr(x+r*.32,y-r*1.0,r*.12,r*.3,r*.05);ctx.fill();}
  if(r>6){
    ctx.fillStyle='#2a2320';ctx.beginPath();ctx.arc(x-r*.16,y-r*.8,Math.max(.8,r*.06),0,TAU);ctx.arc(x+r*.16,y-r*.8,Math.max(.8,r*.06),0,TAU);ctx.fill();
    if(r>8){ctx.strokeStyle='#8a4b3a';ctx.lineWidth=Math.max(1,r*.05);ctx.lineCap='round';ctx.beginPath();ctx.arc(x,y-r*.7,r*.12,.2,Math.PI-.2);ctx.stroke();}
  }
  if(flash>0){ctx.strokeStyle='rgba(255,255,255,'+flash+')';ctx.lineWidth=r*.3;ctx.beginPath();ctx.arc(x,y,r*1.05,0,TAU);ctx.stroke();}
}
const MIXC={};
function mix(a,b,t){const k=a+b+t;return MIXC[k]||(MIXC[k]=mix0(a,b,t));}
function mix0(a,b,t){
  const A=parseInt(a.slice(1),16),B=parseInt(b.slice(1),16),f=sh=>Math.round(((A>>sh)&255)*(1-t)+((B>>sh)&255)*t);
  return 'rgb('+f(16)+','+f(8)+','+f(0)+')';
}
function trapz(xa,xb,ha,hb){ctx.beginPath();ctx.moveTo(xa,-ha);ctx.lineTo(xb,-hb);ctx.lineTo(xb,hb);ctx.lineTo(xa,ha);ctx.closePath();ctx.fill();}
function drawBus(x,y,len,wid,ang,col,o){
  o=o||{};
  const hid=o.hidden,C=hid?{c:'#6b7488',d:'#434b5c',l:'#9aa3b5'}:PAL[col];
  ctx.save();ctx.translate(x+(o.dx||0),y+(o.dy||0));
  if(o.scale&&o.scale!==1)ctx.scale(o.scale,o.scale);
  const hl=len/2,hw=wid/2,ratio=len/wid,kind=ratio<1.8?0:ratio<3.4?1:2,r=Math.min(hw*.62,len*.2);
  // bóng đổ (luôn lệch xuống)
  ctx.save();ctx.translate(0,wid*.1+1.5);ctx.rotate(ang);ctx.fillStyle='rgba(20,34,56,.24)';rr(-hl,-hw,len,wid,r);ctx.fill();ctx.restore();
  ctx.rotate(ang);
  // bánh xe
  const wl=Math.min(len*.18,wid*.52),wt=wid*.16;ctx.fillStyle='#161c2a';
  (kind===2?[-.32,.3]:kind===1?[-.3,.28]:[-.27,.27]).forEach(k=>{rr(len*k-wl/2,-hw-wt*.5,wl,wt,wt*.4);ctx.fill();rr(len*k-wl/2,hw-wt*.5,wl,wt,wt*.4);ctx.fill();});
  // thân xe
  const gr=ctx.createLinearGradient(0,-hw,0,hw);gr.addColorStop(0,mix(C.c,'#ffffff',.32));gr.addColorStop(.45,C.c);gr.addColorStop(1,mix(C.c,C.d,.5));
  ctx.fillStyle=gr;rr(-hl,-hw,len,wid,r);ctx.fill();
  ctx.lineWidth=Math.max(1.2,wid*.045);ctx.strokeStyle='rgba(18,28,48,.62)';rr(-hl,-hw,len,wid,r);ctx.stroke();
  // đèn trước / đèn sau
  ctx.fillStyle='#fff7c4';rr(hl-wid*.11,-hw+wid*.09,wid*.1,wid*.2,wid*.04);ctx.fill();rr(hl-wid*.11,hw-wid*.29,wid*.1,wid*.2,wid*.04);ctx.fill();
  ctx.fillStyle='#e5484d';rr(-hl+wid*.01,-hw+wid*.09,wid*.08,wid*.18,wid*.03);ctx.fill();rr(-hl+wid*.01,hw-wid*.27,wid*.08,wid*.18,wid*.03);ctx.fill();
  if(!hid){
    const roof=mix(C.c,'#ffffff',.26),glass='#22304a';
    let ax;
    if(kind===0){                                                   // ô tô con
      ctx.fillStyle=roof;rr(-len*.2,-hw*.72,len*.34,wid*.72,wid*.14);ctx.fill();
      ctx.fillStyle=glass;trapz(len*.12,len*.3,hw*.74,hw*.58);trapz(-len*.33,-len*.2,hw*.56,hw*.7);
      ctx.fillStyle='rgba(255,255,255,.3)';trapz(len*.15,len*.19,hw*.6,hw*.55);
      ctx.fillStyle=C.d;rr(len*.2,-hw-wid*.07,len*.06,wid*.1,wid*.03);ctx.fill();rr(len*.2,hw-wid*.03,len*.06,wid*.1,wid*.03);ctx.fill();   // gương
      ax=-len*.03;
    }else if(kind===1){                                             // xe khách nhỏ
      ctx.fillStyle=roof;rr(-len*.41,-hw*.8,len*.66,wid*.8,wid*.14);ctx.fill();

      ctx.fillStyle=glass;trapz(len*.27,len*.4,hw*.8,hw*.62);rr(-len*.48,-hw*.52,len*.05,wid*.52,wid*.05);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.3)';trapz(len*.3,len*.33,hw*.66,hw*.6);

    }
    ctx.fillStyle='rgba(255,255,255,.2)';rr(-hl+len*.1,-hw+wid*.06,len*.8,wid*.09,wid*.04);ctx.fill();   // phản chiếu mép trên
    if(!o.noArrow){
      const al=Math.min(len*.34,wid*1.15),cx=ax-al*.5,tip=ax+al*.5,hs=Math.min(wid*.2,al*.3);

/* ====================== bố cục ====================== */
const BG={k:'',cv:document.createElement('canvas')};
let ctx=cv.getContext('2d',{alpha:false});
let W=0,H=0,DPR=1,T=0,RW=0,OX=0;
const L={};
const ring={segs:[],len:1,r:0,items:[],d:20,g:21,pr:10,cap:60,exitS:0,v:100,feed:null,xE:[0,0],pop:[0,0]};
let G=null,screen='menu',uid=0;

function layout(){
  const oldLen=ring.len;
  RW=innerWidth;H=innerHeight;DPR=Math.min(window.devicePixelRatio||1,2,Math.sqrt(2.4e6/(innerWidth*innerHeight)));DPR=Math.max(1,DPR);BG.k='';
  cv.width=Math.round(RW*DPR);cv.height=Math.round(H*DPR);
  W=RW/H>1.05?Math.round(Math.min(RW,Math.max(420,H*1.62))):RW;OX=Math.round((RW-W)/2);
  L.land=RW/H>1.05;
  const topH=clamp(H*.075,50,72),ringH=H*(L.land?.32:.3),slotH=clamp(H*.125,72,120);
  const boostH=0;
  Object.assign(L,{topH,boostH,ringY:topH,ringH,slotY:topH+ringH,slotH});
  L.gridY=L.slotY+slotH+4;
  if(L.land){
    L.boostW=0;
    L.gridX=24;L.gridW=W-48;L.gridH=H-L.gridY-12;
  }else{L.gridX=10;L.gridW=W-20;L.gridH=H-boostH-L.gridY-4;}
  const tw=Math.min(W-16,L.land?820:W-16),sw=tw/4;
  L.slots=[];for(let i=0;i<4;i++)L.slots.push({x:(W-tw)/2+i*sw+4,y:L.slotY+8,w:sw-8,h:slotH-32});
  const rg=L.rg={cx:W/2};
  rg.hw=L.land?Math.min(W*.33,500):Math.min(W*.27,260);
  rg.hh=ringH*(L.land?.3:.32);rg.cy=L.ringY+ringH*(L.land?.5:.47);rg.r=Math.min(rg.hh*.92,rg.hw*.6);
  buildRing();
  ring.d=clamp(ring.len/48,15,27);ring.g=ring.d*1.05;ring.pr=ring.d*.56;
  ring.cap=Math.floor(2*ring.len/ring.d*.72);ring.v=ring.len/7;
  ring.ent=[6,2].map(i=>({sc:ring.segs[i].s0+ring.segs[i].len/2}));   // cổng trái (đoạn đi lên), cổng phải (đoạn đi xuống)
  ring.qmax=clamp(Math.floor((rg.cx-rg.hw-(L.land?26:6)-ring.g*.5-ring.pr)/ring.d),2,7);
  if(oldLen>1&&Math.abs(oldLen-ring.len)>.5){const k=ring.len/oldLen;ring.items.forEach(i=>i.s*=k);}
  const hb=clamp(topH-10,40,54),hy=(topH-hb)/2;
  L.hud={pause:{x:W-12-hb,y:hy,w:hb,h:hb}};
  L.boost=[];
  if(G)setCell();
}
function buildRing(){
  const {cx,cy,hw,hh}=L.rg,r=L.rg.r,P=Math.PI;
  const segs=[
    {t:'L',x0:cx-hw+r,y0:cy-hh,x1:cx+hw-r,y1:cy-hh,nx:0,ny:-1},
    {t:'A',cx:cx+hw-r,cy:cy-hh+r,a0:-P/2,a1:0},
    {t:'L',x0:cx+hw,y0:cy-hh+r,x1:cx+hw,y1:cy+hh-r,nx:1,ny:0},
    {t:'A',cx:cx+hw-r,cy:cy+hh-r,a0:0,a1:P/2},
    {t:'L',x0:cx+hw-r,y0:cy+hh,x1:cx-hw+r,y1:cy+hh,nx:0,ny:1},
    {t:'A',cx:cx-hw+r,cy:cy+hh-r,a0:P/2,a1:P},
    {t:'L',x0:cx-hw,y0:cy+hh-r,x1:cx-hw,y1:cy-hh+r,nx:-1,ny:0},
    {t:'A',cx:cx-hw+r,cy:cy-hh+r,a0:P,a1:1.5*P}
  ];
  let tot=0;for(const g of segs){g.len=g.t==='L'?Math.hypot(g.x1-g.x0,g.y1-g.y0):r*(g.a1-g.a0);g.s0=tot;tot+=g.len;}
  ring.segs=segs;ring.len=tot;ring.r=r;ring.exitS=segs[4].s0+segs[4].len/2;
}
function ringPos(s,off){
  const n=ring.len;s=((s%n)+n)%n;const sg=ring.segs;
  for(let i=0;i<sg.length;i++){
    const g=sg[i];
    if(s<=g.s0+g.len||i===sg.length-1){
      const u=g.len>0?clamp((s-g.s0)/g.len,0,1):0;
      if(g.t==='L')return{x:g.x0+(g.x1-g.x0)*u+g.nx*off,y:g.y0+(g.y1-g.y0)*u+g.ny*off};
      const a=g.a0+(g.a1-g.a0)*u,nx=Math.cos(a),ny=Math.sin(a);
      return{x:g.cx+nx*(ring.r+off),y:g.cy+ny*(ring.r+off)};
    }
  }
}
const laneOff=k=>k===0?ring.g*.5:-ring.g*.5;
function feedS(f,k){return ring.ent[f].sc+(k===0?-1:1)*ring.g*.5;}
function queuePos(f,k,off){return ringPos(feedS(f,k),laneOff(k)+off);}
function setCell(){
  G.cs=Math.min(L.gridW/G.cols,L.gridH/G.rows);
  G.gx0=L.gridX+(L.gridW-G.cs*G.cols)/2;G.gy0=L.gridY+(L.gridH-G.cs*G.rows)/2;
}
function calcDims(){
  const cellT=L.land?62:62;
  return{cols:clamp(Math.floor(L.gridW/cellT),5,L.land?18:14),rows:clamp(Math.floor(L.gridH/cellT),4,11)};
}

/* ====================== sinh màn chơi (luôn giải được) ====================== */
const fitsOcc=(occ,c,r,w,h)=>{for(let y=r;y<r+h;y++)for(let x=c;x<c+w;x++)if(occ[y][x]!==-1)return false;return true;};
function pathClearOcc(occ,c,r,w,h,dir,cols,rows){
  const dx=DX[dir],dy=DY[dir];
  for(let y=r;y<r+h;y++)for(let x=c;x<c+w;x++){let nx=x+dx,ny=y+dy;while(nx>=0&&ny>=0&&nx<cols&&ny<rows){if(occ[ny][nx]!==-1)return false;nx+=dx;ny+=dy;}}
  return true;
}
function genBuses(lv,cols,rows,maxN){
  const nCol=Math.min(9,6+Math.floor((lv-1)/2));
  const idx=PAL.map((_,i)=>i);for(let i=idx.length-1;i>0;i--){const j=rnd(i+1);[idx[i],idx[j]]=[idx[j],idx[i]];}
  const colors=idx.slice(0,nCol),dens=Math.min(.8,.5+lv*.015);
  let best=[];
  for(let at=0;at<14;at++){
    const occ=Array.from({length:rows},()=>Array(cols).fill(-1)),cover=Array.from({length:rows},()=>Array(cols).fill(0)),list=[],target=Math.floor(cols*rows*dens);let filled=0;
    while(filled<target){
      const cand=[],wts=[];let sum=0;
      for(let dir=0;dir<4;dir++)for(let len=1;len<=2;len++){
        const hz=dir%2===1,w=hz?len:1,h=hz?1:len;
        for(let r=0;r<=rows-h;r++)for(let c=0;c<=cols-w;c++){
          if(fitsOcc(occ,c,r,w,h)&&pathClearOcc(occ,c,r,w,h,dir,cols,rows)){
            let blk=0;for(let y=r;y<r+h;y++)for(let x=c;x<c+w;x++)blk+=cover[y][x];
            const wt=(1+blk*5)*(len===2?1.3:.8);cand.push([c,r,w,h,dir,len]);wts.push(wt);sum+=wt;
          }
        }
      }
      if(!cand.length)break;
      let pick=Math.random()*sum,k=0;while(k<cand.length-1&&pick>wts[k]){pick-=wts[k];k++;}
      const [c,r,w,h,dir,len]=cand[k],id=list.length;
      for(let y=r;y<r+h;y++)for(let x=c;x<c+w;x++){occ[y][x]=id;let nx=x+DX[dir],ny=y+DY[dir];while(nx>=0&&ny>=0&&nx<cols&&ny<rows){cover[ny][nx]++;nx+=DX[dir];ny+=DY[dir];}}
      list.push({id,c,r,w,h,dir,len});filled+=len;
    }
    if(list.length>best.length)best=list;
    if(list.length>=Math.max(6,Math.floor(target/2.1)))break;
  }
  const pH=lv<3?0:Math.min(.4,.06*(lv-2));
  return limitBuses(best,maxN).map(b=>Object.assign(b,{col:colors[rnd(nCol)],hidden:Math.random()<pH,revealed:true,cap:b.len*8,rem:0,inflight:0,state:'grid',slot:-1,x:0,y:0,dl:0,dw:0,ang:ANG[b.dir],pop:0,shake:0,bump:0,flash:0,vel:0,fl:null}))
    .map(b=>{b.revealed=!b.hidden;return b;});
}
function limitBuses(list,maxN){
  if(!maxN||list.length<=maxN)return list;
  const a=list.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}
  return a.slice(0,maxN);
}
const cellsOf=b=>{const a=[];for(let y=b.r;y<b.r+b.h;y++)for(let x=b.c;x<b.c+b.w;x++)a.push([x,y]);return a;};
function pathFree(b){
  const dx=DX[b.dir],dy=DY[b.dir],g=G;
  for(const [x,y] of cellsOf(b)){let nx=x+dx,ny=y+dy;while(nx>=0&&ny>=0&&nx<g.cols&&ny<g.rows){const o=g.occ[ny][nx];if(o&&o!==b)return false;nx+=dx;ny+=dy;}}
  return true;
}
function blockerOf(b){
  const dx=DX[b.dir],dy=DY[b.dir],g=G;
  for(const [x,y] of cellsOf(b)){let nx=x+dx,ny=y+dy;while(nx>=0&&ny>=0&&nx<g.cols&&ny<g.rows){const o=g.occ[ny][nx];if(o&&o!==b)return o;nx+=dx;ny+=dy;}}
  return null;
}
function reveal(b,quiet){if(b.revealed)return;b.revealed=true;b.pop=1;if(!quiet)SFX.reveal();}
function revealCheck(quiet){for(const b of G.buses)if(b.state==='grid'&&!b.revealed&&pathFree(b))reveal(b,quiet);}
function revealNeighbors(b){
  for(const [x,y] of cellsOf(b))for(let d=0;d<4;d++){
    const nx=x+DX[d],ny=y+DY[d];if(nx<0||ny<0||nx>=G.cols||ny>=G.rows)continue;
    const o=G.occ[ny][nx];if(o&&o!==b&&!o.revealed)reveal(o);
  }
}

/* ====================== khởi tạo màn ====================== */
function startLevel(lv,mode,carry){
  mode=mode||0;
  const {cols,rows}=calcDims();
  const maxN=mode?({30:5,45:8,60:11})[mode]:0;
  const buses=genBuses(lv,cols,rows,maxN);
  const occ=Array.from({length:rows},()=>Array(cols).fill(null));
  buses.forEach(b=>cellsOf(b).forEach(([x,y])=>occ[y][x]=b));
  G={lv,cols,rows,buses,occ,t:0,state:'play',paused:false,flyers:[],parts:[],slots:[],boost:{vip:1,shuffle:1},vipMode:false,
     toast:'',toastT:0,bumps:0,moves:0,stuck:0,streak:0,lastBoard:-9,hover:null,endT:0,total:buses.length,earned:0,cs:1,gx0:0,gy0:0,puffT:0,mode,timeLimit:mode,timeLeft:(mode&&carry>0)?Math.min(carry,mode):mode,lastTick:-1};
  for(let i=0;i<4;i++)G.slots.push({bus:null,locked:false});
  setCell();buildSupply();revealCheck(true);
  screen='play';
  if(!mode&&lv===1)toast('Bấm xe có đường trống để xe chạy ra!',4.5);
}
function buildSupply(){
  const groups=G.buses.slice().reverse().map(b=>({col:b.col,n:b.cap}));       // thứ tự = thứ tự giải
  ring.items=[];ring.pop=[0,0];ring.feed=[[0,1].map(()=>({q:[],head:0,shift:0})),[0,1].map(()=>({q:[],head:0,shift:0}))];
  let placed=0,gi=0;const N=ring.cap,per=ring.len/Math.ceil(N/2);
  while(gi<groups.length&&placed+groups[gi].n<=N){
    for(let j=0;j<groups[gi].n;j++){const lane=placed%2,i=Math.floor(placed/2);ring.items.push({s:i*per+(lane?per/2:0),lane,col:groups[gi].col,ey:0,dead:false,id:++uid,flash:0,sd:placed*5+2});placed++;}
    gi++;
  }
  let f=0;for(;gi<groups.length;gi++){for(let j=0;j<groups[gi].n;j++)ring.feed[f][j%2].q.push(groups[gi].col);f^=1;}
}
function toast(m,t){if(!G)return;G.toast=m;G.toastT=t||2.6;}

/* ====================== luật chơi ====================== */
function freeSlotIndex(){for(let i=0;i<4;i++){const s=G.slots[i];if(!s.bus)return i;}return -1;}
function tapBus(b){
  const g=G;if(b.state!=='grid')return;
  if(g.vipMode){vipBus(b);return;}
  if(!b.revealed){b.shake=1;SFX.deny();return;}
  if(!pathFree(b)){b.bump=1;g.bumps++;const k=blockerOf(b);if(k)k.flash=1;SFX.bump();return;}
  const si=freeSlotIndex();
  if(si<0){toast('Bãi đậu đầy! Chờ một xe đầy khách rời bãi.');SFX.deny();return;}
  launch(b,si,false);
}
const PARK_R=[0,1.5,2.5,3.4];
function parkDims(b,sl){const r=PARK_R[b.len]||2.5,dw=Math.min(sl.h*.9,sl.w*.94/r);return {l:dw*r,w:dw};}
function pxOf(b){const g=G;b.x=g.gx0+(b.c+b.w/2)*g.cs;b.y=g.gy0+(b.r+b.h/2)*g.cs;b.dl=b.len*g.cs-g.cs*.1;b.dw=g.cs*.62;}
function launch(b,si,direct){
  const g=G;pxOf(b);
  cellsOf(b).forEach(([x,y])=>g.occ[y][x]=null);
  g.slots[si].bus=b;b.slot=si;g.moves++;
  if(direct)startFly(b);else{b.state='exit';b.vel=90;}
  revealNeighbors(b);revealCheck();SFX.go();
}
function startFly(b){
  const sl=L.slots[b.slot],tx=sl.x+sl.w/2,ty=sl.y+sl.h/2,dist=Math.hypot(tx-b.x,ty-b.y);
  b.state='fly';b.fl={t:0,dur:clamp(dist/1300,.4,.8),x0:b.x,y0:b.y,a0:b.ang,l0:b.dl,w0:b.dw};
}
function outGrid(b){
  const g=G,x1=g.gx0+g.cols*g.cs,y1=g.gy0+g.rows*g.cs;
  switch(b.dir){case 0:return b.y+b.dl/2<g.gy0;case 1:return b.x-b.dl/2>x1;case 2:return b.y-b.dl/2>y1;default:return b.x+b.dl/2<g.gx0;}
}
function chargeBoost(k){
  const g=G;
  if(g.boost[k]>0){g.boost[k]--;return true;}
  toast('Hết lượt trong màn này');SFX.deny();return false;
}
function canAfford(k){return G.boost[k]>0;}
function boostVip(){
  const g=G;
  if(g.vipMode){g.vipMode=false;toast('Đã hủy VIP');return;}
  if(g.slots[0].bus){toast('Ô VIP đang có xe');SFX.deny();return;}
  if(!g.buses.some(b=>b.state==='grid')){SFX.deny();return;}
  if(!canAfford('vip')){toast('Hết lượt VIP trong màn này');SFX.deny();return;}
  g.vipMode=true;SFX.click();toast('Chọn 1 xe bất kỳ để bay thẳng vào ô VIP',4);
}
function vipBus(b){
  const g=G;if(!chargeBoost('vip')){g.vipMode=false;return;}
  g.vipMode=false;launch(b,0,true);
}
function findInFeeders(col){for(const f of ring.feed)for(const fd of f)for(let i=fd.head;i<fd.q.length;i++)if(fd.q[i]===col)return[fd,i];return null;}
function boostShuffle(){
  const g=G;
  if(ring.items.length<4){SFX.deny();return;}
  if(!chargeBoost('shuffle'))return;
  const cols=ring.items.map(i=>i.col);for(let i=cols.length-1;i>0;i--){const j=rnd(i+1);[cols[i],cols[j]]=[cols[j],cols[i]];}
  ring.items.forEach((it,i)=>{it.col=cols[i];it.flash=1;});
  SFX.shuffle();toast('Đã xáo trộn đám đông!');
}
function tryBoard(it){
  const g=G;
  for(let i=0;i<4;i++){
    const b=g.slots[i].bus;
    if(b&&b.state==='parked'&&b.rem>0&&b.col===it.col){
      it.dead=true;const p=ringPos(it.s,laneOff(it.lane)+it.ey);
      g.flyers.push({x0:p.x,y0:p.y,bus:b,col:it.col,seed:it.sd,t:0,dur:.2+Math.random()*.05});
      b.rem--;b.inflight++;
      g.streak=(T-g.lastBoard<.3)?g.streak+1:0;g.lastBoard=T;SFX.board(g.streak);
      return;
    }
  }
}
function burst(x,y,col,n,spd){
  for(let i=0;i<n;i++){const a=Math.random()*TAU,v=(.4+Math.random())*(spd||160);G.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-60,life:.7,max:.7,col,r:2+Math.random()*3});}
}
function confetti(){
  for(let i=0;i<110;i++){G.parts.push({x:Math.random()*W,y:-20-Math.random()*H*.3,vx:(Math.random()-.5)*120,vy:120+Math.random()*220,life:2.6,max:2.6,col:PAL[rnd(9)].c,r:4+Math.random()*4,rect:true,rot:Math.random()*6});}
}
function depart(b){
  const g=G;b.state='leave';b.vel=60;g.slots[b.slot].bus=null;b.slot=-1;
  SFX.full();burst(b.x,b.y,PAL[b.col].l,16,200);
}
function win(){
  const g=G;g.state='won';g.endT=0;
  const stars=g.mode?(g.timeLeft>g.timeLimit*.5?3:g.timeLeft>g.timeLimit*.2?2:1):(g.bumps<=3?3:g.bumps<=9?2:1);g.stars=stars;
  g.earned=30+g.lv*2+(g.mode?15:0)+stars*10;S.coins+=g.earned;if(g.mode){RUN.pts+=g.earned;RUN.lv++;}if(g.mode)S.tlevel=g.lv+1;else S.level=g.lv+1;
  saveProfile();
  SFX.win();confetti();
}
function lose(){
  const g=G;g.state='lost';g.endT=0;SFX.lose();
  if(g.mode){g.jam=true;showOv('timeup');return;}
  showOv('lost');
}

function timeup(){const g=G;g.state='lost';g.endT=0;SFX.lose();showOv('timeup');}
function tickTimer(dt){
  const g=G;if(!g.mode||g.moves===0||g.state!=='play')return;
  g.timeLeft-=dt;
  const s=Math.ceil(g.timeLeft);
  if(s<=5&&s>0&&s!==g.lastTick){g.lastTick=s;SFX.tick();}
  if(g.timeLeft<=0){g.timeLeft=0;timeup();}
}

/* ====================== cập nhật ====================== */
function update(dt){
  const g=G;g.t+=dt;if(g.toastT>0)g.toastT-=dt;
  const d=ring.d;

    }
    ring.items=ring.items.filter(i=>!i.dead);
    // nguồn khách
        for(let f=0;f<2;f++)for(let k=0;k<2;k++){
      const fd=ring.feed[f][k];
      if(fd.shift>0)fd.shift=Math.max(0,fd.shift-d*5*dt);
      const other=ring.feed[1-f],otherLeft=other[0].head<other[0].q.length||other[1].head<other[1].q.length;
      if(fd.head<fd.q.length&&fd.shift<d*.25&&ring.items.length<ring.cap&&(!otherLeft||ring.pop[f]<=ring.pop[1-f]+3)){
        const s=feedS(f,k);let free=true;
        for(const it of ring.items){if(it.lane!==k)continue;const ds=((it.s-s+ring.len*1.5)%ring.len)-ring.len/2;if(Math.abs(ds)<d*.95){free=false;break;}}
        if(free){ring.items.push({s,lane:k,col:fd.q[fd.head++],ey:d,dead:false,id:++uid,flash:0,sd:fd.head-1+k*31+f*57});fd.shift=d;ring.pop[f]++;}
      }
    }
  }
  // hành khách bay
  for(const fl of g.flyers){
    fl.t+=dt*rush/fl.dur;
    if(fl.t>=1){fl.bus.inflight--;fl.bus.pop=.6;fl.done=true;const b=fl.bus;burst(b.x,b.y-b.dl*.1,PAL[fl.col].l,3,80);}
  }
  g.flyers=g.flyers.filter(f=>!f.done);
  // xe
  for(const b of g.buses){
    if(b.pop>0)b.pop=Math.max(0,b.pop-dt*3);
    if(b.shake>0)b.shake=Math.max(0,b.shake-dt*3);
    if(b.bump>0)b.bump=Math.max(0,b.bump-dt*3.2);
    if(b.flash>0)b.flash=Math.max(0,b.flash-dt*2.2);
    if(b.state==='exit'){
      b.vel=Math.min(1200,b.vel+3200*dt);b.x+=DX[b.dir]*b.vel*dt;b.y+=DY[b.dir]*b.vel*dt;
      if(outGrid(b))startFly(b);
    }else if(b.state==='fly'){
      const f=b.fl;f.t+=dt/f.dur;const t=Math.min(1,f.t),e=t*t*(3-2*t);
      const sl=L.slots[b.slot],tx=sl.x+sl.w/2,ty=sl.y+sl.h/2,cx=(f.x0+tx)/2,cy=Math.min(f.y0,ty)-30,u=1-e;
      b.x=u*u*f.x0+2*u*e*cx+e*e*tx;b.y=u*u*f.y0+2*u*e*cy+e*e*ty;
      const da=((0-f.a0+3*Math.PI)%TAU)-Math.PI;b.ang=f.a0+da*e;
      const pd=parkDims(b,sl);b.dl=lerp(f.l0,pd.l,e);b.dw=lerp(f.w0,pd.w,e);
      if(t>=1){b.state='parked';b.rem=b.cap;b.inflight=0;b.pop=1;b.ang=0;SFX.park();burst(tx,ty+sl.h*.4,'#ffffff',8,90);}
    }else if(b.state==='parked'){
      const sl=L.slots[b.slot];b.x=sl.x+sl.w/2;b.y=sl.y+sl.h/2;{const pd=parkDims(b,sl);b.dl=pd.l;b.dw=pd.w;}

      g.puffT-=dt;if(g.puffT<=0){g.puffT=.04;g.parts.push({x:b.x-b.dl*.5,y:b.y,vx:-40,vy:-20,life:.5,max:.5,col:'#ffffff',r:5+Math.random()*4});}
      if(b.x-b.dl>W+40)b.state='gone';
    }
  }
  // hạt
  for(const p of g.parts){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.rect?60:260)*dt;if(p.rect)p.rot+=dt*6;}
  g.parts=g.parts.filter(p=>p.life>0);
  if(g.state==='play'){
    if(g.buses.every(b=>b.state==='leave'||b.state==='gone')){win();}
    else{checkStuck(dt);tickTimer(dt);}
  }else if(g.state==='won'){
    g.endT+=dt;
    if(g.mode){if(g.endT>.95&&!g.shown){g.shown=true;startLevel(S.tlevel,g.mode,g.timeLeft);if(G)G.fade=true;}}
    else if(g.endT>1.3&&!g.shown){g.shown=true;showOv('win');}
  }
}
function checkStuck(dt){
  const g=G;
  const movers=g.buses.some(b=>b.state==='exit'||b.state==='fly')||g.flyers.length>0;
  const gridLeft=g.buses.some(b=>b.state==='grid');

  const match=ring.items.some(it=>parked.some(b=>b.col===it.col));
  const feedLeft=ring.feed.some(f=>f.some(fd=>fd.head<fd.q.length));
  const sat=ring.items.length>=ring.cap-1||!feedLeft;
  if(!movers&&parked.length&&(freeSlotIndex()<0||!gridLeft)&&!match&&sat)g.stuck+=dt;else g.stuck=Math.min(0,g.stuck);
  if(g.stuck>1.4)lose();
}

    h=`<div class="card" style="--tone:#2f6fed">${badge('pause','#2f6fed')}<h2>Tạm dừng</h2><p>Màn ${G.lv}${G.mode?' · '+G.mode+' giây':''}</p>
    <div><button class="btn big green wide" data-a="resume">${ico('play')}Tiếp tục</button></div>
    <div class="row"><button class="btn gold" data-a="restart">${ico('redo')}${G.mode?'Chơi lại từ màn 1':'Chơi lại màn này'}</button>${soundBtn('dark')}</div>
    <div><button class="btn grey" data-a="menu">${ico('home')}Thoát về menu</button></div></div>`;
  }else if(kind==='win'){
    const st=G.stars||1;
    h=`<div class="card" style="--tone:#f2b01e">${badge('trophy','#f2b01e')}<h2>Màn ${G.lv} hoàn thành!</h2><div class="stars">${star(1)}${star(st>=2)}${star(st>=3)}</div>
    ${G.mode?'<p>Còn dư '+Math.ceil(G.timeLeft)+' giây</p>':''}
    <div class="earn"><i class="coin"></i>+${G.earned} điểm</div><p style="margin:-6px 0 14px">Tổng: <b>${S.coins}</b> điểm · ${esc(S.name)}</p>
    <div><button class="btn big green wide" data-a="next">Màn tiếp theo${ico('next')}</button></div>
    <div class="row"><button class="btn gold" data-a="restart">${ico('redo')}Chơi lại</button><button class="btn grey" data-a="menu">${ico('home')}Về menu</button></div></div>`;
  }else if(kind==='timeup'){
    const all=Object.entries(players).sort((a,b)=>b[1].score-a[1].score||a[0].localeCompare(b[0]));
    const myRank=all.findIndex(e=>e[0]===S.name)+1;
    const row=(e,i)=>'<li class="'+(e[0]===S.name?'me':'')+'"><span class="rk">'+(i+1)+'</span><span class="nn">'+esc(e[0])+'</span><small>Màn '+Math.max(e[1].level||1,e[1].tlevel||1)+'</small><b>'+e[1].score+'</b></li>';
    const top=all.slice(0,5).map(row).join('')+(myRank>5?'<li style="justify-content:center;background:none;padding:0;min-height:0;color:var(--muted)">⋯</li>'+row(all[myRank-1],myRank-1):'');
    h=`<div class="card" style="--tone:#f97316">${badge('hourglass','#f97316')}<h2>${G.jam?'Kẹt xe!':'Hết giờ!'}</h2>
    <p style="margin:0 0 4px"><b>${esc(S.name)}</b> · ${G.mode} giây · qua ${RUN.lv} màn</p>
    <div class="earn"><i class="coin"></i>${RUN.pts} điểm</div>
    <p style="margin:-6px 0 10px">Tổng điểm tất cả các màn${myRank?' · Hạng <b>'+myRank+'</b>':''}</p>
    <ol class="board">${top}</ol>
    <div><button class="btn big green wide" data-a="restart">${ico('redo')}Chơi lại</button></div>
    <div class="row"><button class="btn gold" data-a="timed">${ico('clock')}Đổi thời gian</button><button class="btn grey" data-a="menu">${ico('home')}Về menu</button></div></div>`;
  }else if(kind==='lost'){
    h=`<div class="card" style="--tone:#e5484d">${badge('jam','#e5484d')}<h2>Kẹt xe rồi!</h2><p>Bãi đậu đầy mà không còn khách đúng màu trên băng chuyền.</p>
    <div class="row"><button class="btn gold" data-a="restart">${ico('redo')}Chơi lại</button><button class="btn grey" data-a="menu">${ico('home')}Về menu</button></div></div>`;
  }
  ov.innerHTML=h;
}
function hideOv(){ov.className='';ov.innerHTML='';}
function act(a){
  SFX.click();if(a!=='clearboard')clearArm=false;
  switch(a){
    case'play':if(!applyName())break;hideOv();startLevel(S.level,0);break;
    case'timed':if(!applyName())break;showOv('modes');break;
    case'board':{const el=document.getElementById('nm');if(el)draft=el.value;showOv('board');break;}
    case'clearboard':if(!clearArm){clearArm=true;showOv('board');setTimeout(()=>{if(clearArm){clearArm=false;if(ov.querySelector('[data-a="clearboard"]'))showOv('board');}},4000);}else{clearArm=false;players={};store.set('players',players);S.coins=0;S.level=1;S.tlevel=1;draft=null;showOv('board');}break;
    case't30':case't45':case't60':RUN={pts:0,lv:0};S.tlevel=1;hideOv();startLevel(1,+a.slice(1));break;
    case'sound':{const el=document.getElementById('nm');if(el)draft=el.value;}S.sound=!S.sound;store.set('sound',S.sound);if(S.sound)SFX.click();showOv(G&&screen==='play'?'pause':'menu');break;
    case'help':showOv('help');break;
    case'pause':G.paused=true;showOv('pause');break;
    case'resume':G.paused=false;hideOv();break;
    case'restart':{const m=G?G.mode:0;if(m){RUN={pts:0,lv:0};S.tlevel=1;hideOv();startLevel(1,m);}else{hideOv();startLevel(G?G.lv:S.level,0);}break;}
    case'next':{const m=G?G.mode:0,c=(m&&G)?G.timeLeft:0;hideOv();startLevel(m?S.tlevel:S.level,m,c);break;}
    case'menu':G=null;screen='menu';showOv('menu');break;
  }
}
ov.addEventListener('input',e=>{if(e.target.id==='nm')e.target.classList.remove('bad');});
ov.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)act(b.dataset.a);});

/* ====================== điều khiển ====================== */
const inR=(r,x,y)=>x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h;
function busAt(x,y){
  const g=G;const c=Math.floor((x-g.gx0)/g.cs),r=Math.floor((y-g.gy0)/g.cs);
  if(c<0||r<0||c>=g.cols||r>=g.rows)return null;const b=g.occ[r][c];return b&&b.state==='grid'?b:null;
}
cv.addEventListener('pointerdown',e=>{
  if(screen!=='play'||!G||G.paused||G.state!=='play')return;
  ac();const x=e.clientX-OX,y=e.clientY,h=L.hud;
  if(inR(h.pause,x,y)){act('pause');return;}
  for(const b of L.boost)if(inR(b,x,y)){
    SFX.click();
    if(b.k==='vip')boostVip();else boostShuffle();
    return;
  }
  const b=busAt(x,y);
  if(b)tapBus(b);
  else if(G.vipMode){G.vipMode=false;}
});
cv.addEventListener('pointermove',e=>{
  if(screen!=='play'||!G){cv.style.cursor='default';return;}
  const x=e.clientX-OX,y=e.clientY;G.hover=busAt(x,y);
  const over=G.hover||L.boost.some(b=>inR(b,x,y))||Object.values(L.hud).some(r=>inR(r,x,y));
  cv.style.cursor=over?'pointer':'default';
});
cv.addEventListener('pointerleave',()=>{if(G)G.hover=null;});
addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='INPUT'){if(e.key==='Enter')act('play');return;}
  if(e.key==='Escape'){
    if(G&&screen==='play'&&G.state==='play'){if(G.vipMode){G.vipMode=false;return;}if(G.paused)act('resume');else act('pause');}
  }else if(e.key==='m'||e.key==='M'){S.sound=!S.sound;store.set('sound',S.sound);if(S.sound)SFX.click();if(!G||screen!=='play')showOv('menu');}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G&&screen==='play'&&G.state==='play'&&!G.paused)act('pause');});
addEventListener('resize',()=>{
  layout();
  if(G&&G.moves===0&&!G.paused&&G.state==='play'){const d=calcDims();if(d.cols!==G.cols||d.rows!==G.rows)startLevel(G.lv,G.mode,G.mode?G.timeLeft:0);}
});

/* ====================== chạy ====================== */
layout();showOv('menu');requestAnimationFrame(loop);
window.__bf={get G(){return G},ring,L,tapBus,update,startLevel,pathFree,PAL,S,draw,showOv};
})();
</script>
